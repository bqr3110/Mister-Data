<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Ojeador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="envoltorio">

<header>
  <div class="titulo">
    <h1>Ojeador</h1>
    <span class="sub" id="cabecera-sub"></span>
    <button class="tema" id="btn-tema">Cambiar tema</button>
  </div>
</header>

<div class="controles" hidden>
  <div class="fila">
    <label class="campo"><span>Buscar jugador</span>
      <input type="text" id="buscar" placeholder="Sancet, Mbappé…" autocomplete="off"></label>

    <label class="campo"><span>Puntuación</span>
      <select id="fuente">
        <option value="m2" selected>Mixto 2</option>
        <option value="md">Cronistas MD</option>
        <option value="cm">Cronistas Marca</option>
        <option value="sf">Sofascore · nota 0-10</option>
      </select></label>

    <div class="campo"><span>Dónde juega</span>
      <div class="segmento" id="sede">
        <button data-v="" aria-pressed="true">Todo</button>
        <button data-v="C" aria-pressed="false">Casa</button>
        <button data-v="F" aria-pressed="false">Fuera</button>
      </div></div>

    <label class="campo"><span>Partidos mínimos</span>
      <input type="number" id="minpj" value="1" min="1" max="38"></label>
  </div>

  <div class="barra-filtros" id="barra-filtros">
    <div class="grupo">
      <button class="filtro" data-p="pos" aria-expanded="false">Posición</button>
      <div class="pop" id="pop-pos" hidden>
        <div class="pop-cuerpo columnas" id="panel-pos"></div>
      </div>
    </div>

    <div class="grupo">
      <button class="filtro" data-p="equipos" aria-expanded="false">Equipos</button>
      <div class="pop ancho" id="pop-equipos" hidden>
        <div class="pop-cab">
          <div class="segmento chico" id="modo-eq">
            <button data-v="incluir" aria-pressed="true">Solo estos</button>
            <button data-v="excluir" aria-pressed="false">Todos menos</button>
          </div>
          <button class="limpiar" data-limpiar="equipos">quitar</button>
        </div>
        <div class="pop-cuerpo rejilla" id="panel-equipos"></div>
      </div>
    </div>

    <div class="grupo">
      <button class="filtro" data-p="valor" aria-expanded="false">Valor</button>
      <div class="pop" id="pop-valor" hidden>
        <div class="pop-cuerpo">
          <div class="linea-num">
            <span class="etiqueta">desde</span>
            <input type="number" id="val-min" step="0.1" min="0" placeholder="—"><span class="uni">M</span>
            <span class="etiqueta">hasta</span>
            <input type="number" id="val-max" step="0.1" min="0" placeholder="—"><span class="uni">M</span>
          </div>
          <div class="linea-num">
            <span class="etiqueta">subida de hoy desde</span>
            <input type="number" id="cam-min" step="1" placeholder="—"><span class="uni">k</span>
          </div>
          <button class="limpiar" data-limpiar="valor">quitar</button>
        </div>
      </div>
    </div>

    <div class="grupo">
      <button class="filtro" data-p="excluir" aria-expanded="false">Excluir</button>
      <div class="pop ancho" id="pop-excluir" hidden>
        <div class="pop-cuerpo">
          <span class="etiqueta">Quitar del cálculo…</span>

          <label class="casilla"><input type="checkbox" id="ex-gol"><span>Partidos con gol</span></label>
          <label class="casilla"><input type="checkbox" id="ex-roja"><span>Partidos con roja</span></label>

          <div class="sub">
            <button class="sub-cab" data-sub="minutos" aria-expanded="false">Jugó menos de X minutos</button>
            <div class="sub-cuerpo" data-sub-de="minutos" hidden>
              <label class="casilla"><input type="checkbox" id="ex-min"><span>quitar los partidos de menos de</span></label>
              <div class="linea-num">
                <input type="range" id="minminutos" value="45" min="5" max="90" step="5">
                <output id="out-min">45 min</output>
              </div>
            </div>
          </div>

          <div class="sub">
            <button class="sub-cab" data-sub="rivales" aria-expanded="false">Partidos contra</button>
            <div class="sub-cuerpo" data-sub-de="rivales" hidden>
              <div class="rejilla" id="panel-rivales"></div>
              <div class="nota" id="nota-rival" hidden>Los jugadores de esos equipos no pierden ningún partido, así que la comparación deja de ser homogénea.</div>
            </div>
          </div>

          <div class="sub">
            <button class="sub-cab" data-sub="jornadas" aria-expanded="false">Jornada nº</button>
            <div class="sub-cuerpo" data-sub-de="jornadas" hidden>
              <div class="jornadas" id="jornadas"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="grupo">
      <button class="filtro" data-p="stats" aria-expanded="false">Estadísticas</button>
      <div class="pop ancho" id="pop-stats" hidden>
        <div class="pop-cuerpo" id="panel-stats"></div>
      </div>
    </div>

    <div class="grupo">
      <button class="filtro" data-p="cond" aria-expanded="false">Más</button>
      <div class="pop ancho" id="pop-cond" hidden>
        <div class="pop-cuerpo">
          <span class="etiqueta">Deja fuera a quien no cumpla</span>
          <div class="rangos" id="rangos"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="activos" id="activos"></div>
</div>

<div id="cargando">Cargando datos…</div>
<div id="error" hidden></div>
<div class="resumen" id="resumen"></div>

<div class="tabla-caja" hidden>
  <table>
    <thead><tr id="cabeceras"></tr></thead>
    <tbody id="cuerpo"></tbody>
  </table>
</div>

</div>

<dialog id="ficha">
  <div class="ficha-cab">
    <h2 id="ficha-nombre"></h2>
    <span class="sub" id="ficha-equipo"></span>
    <button class="cerrar" id="ficha-cerrar" aria-label="Cerrar">&times;</button>
  </div>
  <div class="sistemas" id="ficha-sistemas"></div>
  <div class="proximos" id="ficha-prox"></div>
  <div class="ficha-cuerpo"><table id="ficha-tabla"></table></div>
  <div class="ficha-pie" id="ficha-pie"></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
