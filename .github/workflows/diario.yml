name: Captura

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  capturar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Calendario y estado de partidos
        run: python scripts/partidos.py

      - name: Eventos de los partidos nuevos
        run: python scripts/eventos.py

      - name: Puntuaciones
        run: python scripts/puntos.py

      - name: Valor de mercado
        run: python scripts/mercado.py

      - name: Preparar los datos de la web
        run: python scripts/web.py

      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add datos/ web/
          git diff --staged --quiet || git commit -m "Captura $(date +'%Y-%m-%d %H:%M')"
          git push

  # Publica la carpeta web/ en GitHub Pages.
  # Va aqui dentro y no en un archivo aparte a proposito: un commit hecho por
  # un workflow no dispara otros workflows, asi que un archivo suelto nunca
  # llegaria a ejecutarse.
  publicar:
    needs: capturar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # ref: main es imprescindible. Sin eso se descargaria el codigo tal y
      # como estaba ANTES de que el trabajo anterior guardara los datos, y la
      # web se publicaria con los datos viejos.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: despliegue
        uses: actions/deploy-pages@v4
