name: Captura

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  capturar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Calendario y estado de partidos
        run: python scripts/partidos.py

      - name: Eventos de los partidos nuevos
        run: python scripts/eventos.py

      - name: Puntuaciones
        run: python scripts/puntos.py

      - name: Valor de mercado
        run: python scripts/mercado.py

      - name: Preparar los datos de la web
        run: python scripts/web.py

      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add datos/ web/
          git diff --staged --quiet && echo "nada que guardar" && exit 0
          git commit -m "Captura $(date +'%Y-%m-%d %H:%M')"
          # la captura tarda sus minutos. Si mientras tanto has subido algo a
          # mano, el push se rechazaria y se perderia la captura entera.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "reintento $i"
            sleep 5
          done
          exit 1
