name: Captura diaria

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar el script
        run: python scripts/mercado.py
      
      - name: Ejecutar el script de puntos
        run: python scripts/puntos.py

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "Captura $(date +'%Y-%m-%d')"
          git push
