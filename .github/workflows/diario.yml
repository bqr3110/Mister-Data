name: Captura

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests beautifulsoup4

      - name: Calendario y estado de partidos
        run: python scripts/partidos.py

      - name: Eventos de los partidos nuevos
        run: python scripts/eventos.py

      - name: Puntuaciones
        run: python scripts/puntos.py

      - name: Valor de mercado
        run: python scripts/mercado.py

      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "Captura $(date +'%Y-%m-%d %H:%M')"
          git push
