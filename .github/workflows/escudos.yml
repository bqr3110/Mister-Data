name: Escudos

# A mano, cuando cambien los equipos de Primera. Los escudos no cambian
# solos, asi que no tiene sentido pedirlos cada dos horas.
on:
  workflow_dispatch:

jobs:
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Descargar escudos
        run: python scripts/escudos.py

      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add web/escudos/
          git diff --staged --quiet || git commit -m "Escudos de los equipos"
          git push
